<!-- MODAL -->
<div id="modal" class="modal">

<div class="modal-content">

<i class="fa-brands fa-instagram"></i>

<a id="waLink" target="_blank" class="btn-wa">
<i class="fa-brands fa-whatsapp"></i>
</a>

</div>

</div>

<script>
function openModal(nama, jurusan, desc, img, ig, wa){

document.getElementById("modal").style.display = "flex";

document.getElementById("modal-nama").innerText = nama;
document.getElementById("modal-jurusan").innerText = jurusan;
document.getElementById("modal-desc").innerText = desc;
document.getElementById("modal-img").src = img;

document.getElementById("igLink").href = ig;
document.getElementById("waLink").href = wa;
}

function closeModal(){
document.getElementById("modal").style.display = "none";
}

window.onclick = function(e){
let modal = document.getElementById("modal");

if(e.target == modal){
modal.style.display = "none";
}
}
</script>
