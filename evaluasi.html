<link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
  <div class="logo">
    <a href="index.html">💻 <span>TechVerse</span></a>
  </div>

  <ul class="menu">
    <li><a href="index.html">🏠 Beranda</a></li>

<div id="start-screen" class="start-screen">
    <h2>📋 Evaluasi Informatika</h2>

    <p>Jumlah Soal : <strong>20 Soal</strong></p>
    <p>Waktu Pengerjaan : <strong>10 Menit</strong></p>

    <p class="info">
        Bacalah setiap soal dengan teliti sebelum menjawab.
        Klik tombol di bawah untuk memulai evaluasi.
    </p>

    <button class="btn-start" onclick="mulaiEvaluasi()">
        🚀 Mulai Evaluasi
    </button>
</div>

<div id="quiz-container" style="display:none;">
    <!-- Card evaluasi yang sudah ada -->

<div class="page evaluasi-page">
  <div class="card">
    <h2>📋 Evaluasi Informatika</h2>
    <div id="timer">⏰ 10:00</div>

    <h3 id="nomor"></h3>
    <h3 id="pertanyaan"></h3>

    <div id="opsi"></div>

    <div class="btn-group">
      <button onclick="prevSoal()">⬅ Sebelumnya</button>
      <button onclick="nextSoal()">➡ Berikutnya</button>
      <button onclick="selesai()">✅ Selesai</button>
    </div>
  </div>
  </div>
</div>

<script src="js/evaluasi.js"></script>

<!-- AUTO ACTIVE MENU -->
<script>
const links = document.querySelectorAll(".menu a");
links.forEach(link => {
  if(link.href === window.location.href){
    link.classList.add("active");
  }
});
</script>
